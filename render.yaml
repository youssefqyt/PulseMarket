services:
  - type: web
    name: pulsemarket-api
    runtime: node
    buildCommand: npm ci --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
